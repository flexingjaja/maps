<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive - Codes Postaux & Adresses</title>
    
    <!-- Tailwind CSS pour le style rapide et moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS pour la cartographie -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Assure que la carte reste en dessous des popups/notifications */
        #map { z-index: 10; }
        
        /* Style des popups sur la carte */
        .custom-popup .leaflet-popup-content-wrapper {
            background-color: #1e293b;
            color: white;
            border-radius: 0.5rem;
            padding: 2px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .custom-popup .leaflet-popup-tip { background-color: #1e293b; }
        .custom-popup .leaflet-popup-close-button { color: #cbd5e1 !important; }
        .custom-popup .leaflet-popup-close-button:hover { color: white !important; }
        
        /* Barre de défilement discrète */
        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations des notifications */
        @keyframes slideIn {
            0% { transform: translateX(100%); opacity: 0; }
            10% { transform: translateX(0); opacity: 1; }
            90% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        .toast { animation: slideIn 4s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-slate-50 h-screen w-full overflow-hidden flex flex-col md:flex-row">

    <aside class="w-full md:w-[400px] bg-white shadow-xl flex flex-col h-[50vh] md:h-full z-20 flex-shrink-0">
        
        <!-- En-tête -->
        <div class="p-5 bg-slate-900 text-white flex-shrink-0">
            <h1 class="text-xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-blue-400"></i> Ma Carte
            </h1>
            <p class="text-xs text-slate-400 mt-1">Gérez vos emplacements personnalisés</p>
        </div>

        <div class="flex-1 overflow-y-auto sidebar-scroll p-4 space-y-5">
            
            <!-- Formulaire 1 : Code Postal -->
            <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                <h2 class="text-sm font-semibold text-blue-900 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-draw-polygon text-blue-500"></i> Zone (Code Postal)
                </h2>
                <form id="form-cp" class="space-y-3">
                    <input type="text" id="input-cp" placeholder="Ex: 75001" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <input type="color" id="color-cp" value="#3b82f6" class="h-8 w-12 cursor-pointer rounded border border-slate-200 p-0.5">
                            <span class="text-xs text-slate-500">Couleur</span>
                        </div>
                        <button type="submit" id="btn-cp" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors">
                            Ajouter
                        </button>
                    </div>
                </form>
            </div>

            <!-- Formulaire 2 : Adresse précise -->
            <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                <h2 class="text-sm font-semibold text-emerald-900 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-emerald-500"></i> Adresse précise
                </h2>
                <form id="form-address" class="space-y-3">
                    <input type="text" id="input-label" placeholder="Libellé (ex: Travail, Maman)" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" required>
                    <input type="text" id="input-address" placeholder="Adresse complète" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" required>
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <!-- NOUVEAU : Choix de la couleur pour l'adresse -->
                            <input type="color" id="color-address" value="#10b981" class="h-8 w-12 cursor-pointer rounded border border-slate-200 p-0.5">
                            <span class="text-xs text-slate-500">Couleur</span>
                        </div>
                        <button type="submit" id="btn-address" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors">
                            Placer le repère
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Gestionnaire de lieux -->
            <div class="pt-2 border-t border-slate-200">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Éléments sur la carte</h2>
                <div id="empty-state" class="text-xs text-slate-400 text-center py-4 bg-slate-50 rounded-lg border border-dashed border-slate-200">
                    Aucun élément ajouté.
                </div>
                <ul id="places-list" class="space-y-2"></ul>
            </div>
        </div>
    </aside>

    <!-- Zone principale (Carte) -->
    <main class="flex-1 relative h-[50vh] md:h-full w-full bg-slate-200">
        <div id="map" class="absolute inset-0 w-full h-full"></div>
        <div id="toast-container" class="absolute top-4 right-4 z-[1000] flex flex-col gap-2 w-72 max-w-[90vw] pointer-events-none"></div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. INITIALISATION DE LA CARTE (Centrée sur la France)
        const map = L.map('map', { zoomControl: false }).setView([46.603354, 1.888334], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Fond de carte Esri (Aucune restriction iframe)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri'
        }).addTo(map);

        // 2. ÉTAT ET GESTIONNAIRES
        const layers = {}; // Stocke les couches { id: layerObject }
        let currentId = 0;

        // Fonction pour afficher des notifications (remplace alert)
        function notify(title, msg, isError = false) {
            const container = document.getElementById('toast-container');
            const div = document.createElement('div');
            const color = isError ? 'red' : 'emerald';
            div.className = `toast pointer-events-auto bg-white border-l-4 border-${color}-500 shadow-lg rounded p-3 flex flex-col`;
            div.innerHTML = `<strong class="text-sm text-slate-800">${title}</strong><span class="text-xs text-slate-500">${msg}</span>`;
            container.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        function toggleEmptyState() {
            const list = document.getElementById('places-list');
            const empty = document.getElementById('empty-state');
            empty.style.display = list.children.length === 0 ? 'block' : 'none';
        }

        // Géocodage via l'API Esri
        async function geocodeEsri(query) {
            const url = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?singleLine=${encodeURIComponent(query)}&f=json&maxLocations=1`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0]; // Retourne { location: {x: lon, y: lat}, address: "..." }
                }
                return null;
            } catch (e) {
                console.error(e);
                throw new Error("Erreur de connexion à l'API Esri");
            }
        }

        // NOUVEAU : Création d'une icône de marqueur personnalisée modifiable
        function createCustomIcon(color) {
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<i class="fa-solid fa-location-dot" style="color: ${color}; font-size: 32px; text-shadow: 2px 2px 4px rgba(0,0,0,0.4);"></i>`,
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
        }

        // MODIFIÉ : Ajouter un élément à l'UI avec le sélecteur de modification de couleur
        function addToListUI(id, title, subtitle, icon, colorHex) {
            const ul = document.getElementById('places-list');
            const li = document.createElement('li');
            li.className = 'flex items-center justify-between bg-white p-2 rounded border border-slate-200 shadow-sm gap-2';
            
            // On convertit très grossièrement la couleur pour le fond avec une opacité en hexadécimal (20)
            const bgColor = `${colorHex}20`; 

            li.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="focusMap(${id})">
                    <div id="icon-bg-${id}" class="w-8 h-8 rounded flex items-center justify-center shrink-0 transition-colors" style="background-color: ${bgColor}; color: ${colorHex}">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <div class="flex flex-col truncate">
                        <span class="text-sm font-bold text-slate-700 truncate">${title}</span>
                        <span class="text-xs text-slate-500 truncate">${subtitle}</span>
                    </div>
                </div>
                <div class="flex items-center shrink-0">
                    <input type="color" value="${colorHex}" onchange="updateLayerColor(${id}, this.value)" class="h-6 w-6 cursor-pointer rounded border border-slate-200 p-0 outline-none" title="Modifier la couleur">
                    <button onclick="removeLayer(${id}, this)" class="p-2 text-slate-400 hover:text-red-500 transition ml-1" title="Supprimer">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;
            ul.prepend(li);
            toggleEmptyState();
        }

        // NOUVEAU : Fonction pour mettre à jour la couleur d'un calque (marqueur ou polygone) depuis la liste
        window.updateLayerColor = function(id, newColor) {
            const layerObj = layers[id];
            if (!layerObj) return;

            // Mettre à jour l'icône dans la liste UI
            const iconBg = document.getElementById(`icon-bg-${id}`);
            if (iconBg) {
                iconBg.style.backgroundColor = `${newColor}20`;
                iconBg.style.color = newColor;
            }

            // Mettre à jour sur la carte
            if (layerObj._customType === 'polygon') {
                layerObj.setStyle({
                    color: newColor,
                    fillColor: newColor
                });
            } else if (layerObj._customType === 'marker') {
                layerObj.setIcon(createCustomIcon(newColor));
            }
        };

        // Supprimer un marqueur/cercle de la carte ET de la liste
        window.removeLayer = function(id, btnElement) {
            if (layers[id]) {
                map.removeLayer(layers[id]);
                delete layers[id];
            }
            btnElement.closest('li').remove();
            toggleEmptyState();
        };

        // Centrer la carte sur un élément cliqué dans la liste
        window.focusMap = function(id) {
            const layer = layers[id];
            if (!layer) return;
            if (layer.getBounds) {
                map.fitBounds(layer.getBounds());
            } else if (layer.getLatLng) {
                map.flyTo(layer.getLatLng(), 15);
                layer.openPopup();
            }
        };

        // 3. GESTION DU CODE POSTAL (Formulaire 1)
        document.getElementById('form-cp').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cp = document.getElementById('input-cp').value;
            const color = document.getElementById('color-cp').value;
            const btn = document.getElementById('btn-cp');
            
            btn.innerText = '...';
            btn.disabled = true;

            try {
                // Utilisation de l'API Géo du gouvernement pour récupérer les contours
                const response = await fetch(`https://geo.api.gouv.fr/communes?codePostal=${cp}&format=geojson&geometry=contour`);
                const geojsonData = await response.json();
                
                if (geojsonData.features && geojsonData.features.length > 0) {
                    const polygonLayer = L.geoJSON(geojsonData, {
                        style: {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.4,
                            weight: 2
                        },
                        onEachFeature: function (feature, layer) {
                            layer.bindPopup(`<div class="font-bold text-center px-2 py-1">${feature.properties.nom} <br><span class="text-xs text-slate-500">Code Postal: ${cp}</span></div>`);
                        }
                    }).addTo(map);
                    
                    // On ajoute un tag pour savoir de quel type de forme il s'agit
                    polygonLayer._customType = 'polygon';
                    
                    currentId++;
                    layers[currentId] = polygonLayer;
                    
                    map.fitBounds(polygonLayer.getBounds());
                    
                    const communeNames = geojsonData.features.map(f => f.properties.nom).join(', ');
                    
                    addToListUI(currentId, cp, communeNames, 'fa-draw-polygon', color);
                    document.getElementById('input-cp').value = '';
                    notify('Succès', `Zone(s) pour ${cp} ajoutée(s).`);
                } else {
                    notify('Introuvable', `Aucune commune trouvée pour le code ${cp}.`, true);
                }
            } catch (err) {
                console.error(err);
                notify('Erreur', 'Impossible de joindre le serveur.', true);
            } finally {
                btn.innerText = 'Ajouter';
                btn.disabled = false;
            }
        });

        // 4. GESTION DE L'ADRESSE (Formulaire 2)
        document.getElementById('form-address').addEventListener('submit', async (e) => {
            e.preventDefault();
            const label = document.getElementById('input-label').value;
            const address = document.getElementById('input-address').value;
            const color = document.getElementById('color-address').value;
            const btn = document.getElementById('btn-address');
            
            btn.innerText = '...';
            btn.disabled = true;

            try {
                const result = await geocodeEsri(address);
                
                if (result) {
                    const lat = result.location.y;
                    const lon = result.location.x;
                    
                    // Création du marqueur avec l'icône colorée
                    const marker = L.marker([lat, lon], { icon: createCustomIcon(color) }).addTo(map);
                    
                    // On ajoute un tag pour la modification de couleur ultérieure
                    marker._customType = 'marker';
                    
                    marker.bindPopup(`
                        <div class="text-center p-1">
                            <h3 class="font-bold mb-1">${label}</h3>
                            <p class="text-xs text-slate-300">${result.address}</p>
                        </div>
                    `, { className: 'custom-popup' });
                    
                    currentId++;
                    layers[currentId] = marker;
                    
                    map.flyTo([lat, lon], 15);
                    setTimeout(() => marker.openPopup(), 1000);
                    
                    // On passe la couleur exacte au lieu du nom de classe Tailwind
                    addToListUI(currentId, label, result.address, 'fa-location-dot', color);
                    
                    document.getElementById('input-label').value = '';
                    document.getElementById('input-address').value = '';
                    notify('Succès', `${label} ajouté.`);
                } else {
                    notify('Introuvable', `L'adresse n'a pas été trouvée.`, true);
                }
            } catch (err) {
                notify('Erreur', 'Impossible de joindre le serveur.', true);
            } finally {
                btn.innerText = 'Placer le repère';
                btn.disabled = false;
            }
        });

        // Forcer le calcul de la taille de la carte pour éviter les bugs d'affichage
        setTimeout(() => map.invalidateSize(), 500);
        window.addEventListener('resize', () => map.invalidateSize());
    </script>
</body>
</html>
